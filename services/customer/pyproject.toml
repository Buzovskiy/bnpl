[project]
name = "bnpl-customer"
version = "0.1.0"
description = "Customer and identity service for the BNPL demo"
requires-python = ">=3.12"
dependencies = [
    "django>=5.2,<6",
    "djangorestframework>=3.16,<4",
    "djangorestframework-simplejwt[crypto]>=5.5,<6",
    "psycopg[binary]>=3.2,<4",
    "dj-database-url>=2.3,<4",
    "python-dotenv>=1,<2",
]

[dependency-groups]
dev = ["pytest>=8,<10", "pytest-django>=4.10,<5"]

[tool.pytest.ini_options]
DJANGO_SETTINGS_MODULE = "config.settings"
python_files = ["test_*.py"]
